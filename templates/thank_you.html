<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Thank You</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            background-color: #f0f8ff;
        }
        .navbar {
            background-color: #007bff;
        }
        .navbar-brand, .nav-link {
            color: #fff !important;
        }
        .card {
            border: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .btn-primary {
            background-color: #5bc0de;
            border-color: #46b8da;
        }
        .btn-primary:hover {
            background-color: #31b0d5;
            border-color: #269abc;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <a class="navbar-brand" href="#">Subscribe</a>
    </nav>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card">
                    <div class="card-body text-center">
                        <h1 class="card-title">Thank You for Your Subscription!</h1>
                        <p class="card-text">You will receive an email every morning at 9 am with the highest temperature for the day in Thessaloniki!</p>
                        <a href="/" class="btn btn-primary">Subscribe with Another Email</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
